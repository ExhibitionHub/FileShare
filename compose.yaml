name: eh-fileshare

services:
  fileshare:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3101}:3101"
    environment:
      PORT: 3101
      NODE_ENV: ${NODE_ENV:-development}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
      DATA_DIR: /app/data
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-fileshare/}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3101}
      PASSPORT_BASE_URL: ${PASSPORT_BASE_URL:-http://localhost:4174/}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:-}
      UPLOAD_API_KEYS: ${UPLOAD_API_KEYS:-}
      ALLOW_PUBLIC_UPLOADS: ${ALLOW_PUBLIC_UPLOADS:-true}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      DEFAULT_TTL_HOURS: ${DEFAULT_TTL_HOURS:-168}
      MAX_TTL_HOURS: ${MAX_TTL_HOURS:-720}
      ALLOW_PERMANENT_FILES: ${ALLOW_PERMANENT_FILES:-false}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-15}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-500}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      READ_RATE_LIMIT: ${READ_RATE_LIMIT:-3000}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-300}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-20}
      MAX_QUEUED_UPLOADS: ${MAX_QUEUED_UPLOADS:-100}
      UPLOAD_QUEUE_TIMEOUT_MS: ${UPLOAD_QUEUE_TIMEOUT_MS:-5000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-20000}
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  tls:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    restart: unless-stopped
    read_only: true
    depends_on:
      fileshare:
        condition: service_healthy
    ports:
      - "${TLS_PORT:-8445}:443"
    volumes:
      - ./deploy/tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_ROOT:-./deploy/certs}:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
